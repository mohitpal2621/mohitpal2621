name: Contribution skyline

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Draw the skyline for each date range and refresh the README list
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/skyline.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/skyline docs/skyline/data.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet -m "Update contribution skyline"
          for attempt in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && break
            sleep 5
          done
