name: Profile art

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Render the hologram, the 3D skyline and the data for the interactive skyline page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/profile_art.py assets

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets docs/skyline/data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet -m "Update contribution skyline"
          for attempt in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && break
            sleep 5
          done
